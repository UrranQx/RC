[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "connectome-reservoir-vkr"
version = "0.1.0"
description = "Reproducible connectome-informed reservoir computing experiments"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.13,<3.14"
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "bctpy>=0.6",
    "reservoirpy>=0.3.12",
    "torch>=2.11.0",
    "plotly>=6.7.0",
    "optuna>=4.8.0",
    "mlflow>=3.12.0",
    "optuna-integration[mlflow]>=4.8.0",
    "neurogym>=2.0",
    "tqdm>=4.67",
    "pillow>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "networkx>=3.0",
    "ruff>=0.8.0",
]

[project.urls]
Homepage = "https://github.com/UrranQx/RC"
Repository = "https://github.com/UrranQx/RC"

[tool.setuptools.packages.find]
include = ["conn2res*"]

[tool.pytest.ini_options]
testpaths = ["conn2res/tests", "tests"]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = [
    "*.ipynb",
    "conn2res/_version.py",
    "mlruns",
    "results",
]

[tool.ruff.lint]
select = ["I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
